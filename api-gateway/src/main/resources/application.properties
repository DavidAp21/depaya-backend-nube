spring.application.name=api-gateway
server.port=${PORT:8080}

# Rutas MVC
spring.cloud.gateway.mvc.routes[0].id=ms-auth
spring.cloud.gateway.mvc.routes[0].uri=lb://MS-AUTH
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**

spring.cloud.gateway.mvc.routes[1].id=ms-departamentos
spring.cloud.gateway.mvc.routes[1].uri=lb://MS-DEPARTAMENTOS
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/departamentos/**

spring.cloud.gateway.mvc.routes[2].id=ms-reservas
spring.cloud.gateway.mvc.routes[2].uri=lb://MS-RESERVAS
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/reservas/**

spring.cloud.gateway.mvc.routes[3].id=ms-pagos
spring.cloud.gateway.mvc.routes[3].uri=lb://MS-PAGOS
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/pagos/**

# Eureka
eureka.client.serviceUrl.defaultZone=https://depaya-eureka.onrender.com/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15